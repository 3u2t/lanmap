name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w lanmap-backend
      - run: npm run test -w lanmap-backend
      - run: npm run build -w lanmap-backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w lanmap-frontend
      - run: npm run test -w lanmap-frontend
      - run: npm run build -w lanmap-frontend
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
        working-directory: agent
      - run: go test ./...
        working-directory: agent
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker build --platform linux/amd64 .
      - run: docker build --platform linux/arm64 .
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: python3 -c "import yaml; d=yaml.safe_load(open('docker-compose.yml')); s=d['services']['lanmap']; assert s['x-casaos']['port']==8081, 'casaos port'; print('casaos metadata ok')"
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck --workspaces
      - run: npm run test --workspaces
      - run: npm run build --workspaces
      - run: go build -o lanmap.exe ./windows/launcher.go
      - run: node scripts/build-windows.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lanmap-windows-x64
          path: dist/lanmap-windows-x64.zip
          if-no-files-found: warn
